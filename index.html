<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TAFRA</title>

    <!-- Fonts & Icons -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Fira+Code:wght@400;500;700&display=swap"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <!-- Stylesheet -->
    <link rel="stylesheet" href="2.css">
</head>

<body>

    <!-- شريط التنقل العلوي -->
    <div class="top-bar">
        <div class="top-bar-inner"></div>
    </div>

    <!-- رأس الموقع -->
    <header class="header">

        <div class="logo-container">
            <img
                src="tafra.img/tafara.15489798.jpeg"
                alt="TAFRA Logo"
            >

            <span class="logo-text">TAFRA</span>
        </div>

        <nav class="nav-links">
            <a href="#home" class="active" data-i18n="home">Home</a>

            <a href="#about" data-i18n="about">
                Collections
            </a>

            <a href="#portfolio" data-i18n="portfolio">
                About Us
            </a>

            <a href="#Style Guid" data-i18n="Style Guid">
                Style Guide
            </a>

            <a href="#contact" data-i18n="contact">
                Contact
            </a>
        </nav>

        <div style="display: flex; align-items: center; gap: 15px;">

            <!-- مربع البحث -->
            <div class="search-box">

                <input
                    type="text"
                    placeholder="Search..."
                    class="search-input"
                    data-i18n-placeholder="search"
                >

                <button
                    class="search-btn"
                    aria-label="Search"
                >
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>

            </div>

            <!-- زر تسجيل الدخول -->
            <button
                class="signin-btn"
                type="button"
                data-i18n="signin"
            >
                Sign In
            </button>

        </div>

    </header>


    <!-- Gallery -->
    <section class="gallery-section">

        <div class="gallery-header">

            <h2 data-i18n="lookbook-title">
                TAFRA Lookbook
            </h2>

            <p data-i18n="lookbook-subtitle">
                استكشف أحدث تصميماتنا وأزياءنا الحصرية
            </p>

        </div>


        <div class="gallery-grid">

            <!-- صورة 1 -->
            <div class="gallery-card">

                <img
                    src="tafra.img/tafra584894.6478978597498465498.jpeg"
                    alt="TAFRA Outfit 1"
                >

                <div class="gallery-overlay">

                    <span class="gallery-category">
                        Oversized Collection
                    </span>

                    <h3 class="gallery-title">
                        Signature Streetwear
                    </h3>

                </div>

            </div>


            <!-- صورة 2 -->
            <div class="gallery-card">

                <img
                    src="tafra.img/tafra584894.6478978565494.jpeg"
                    alt="TAFRA Outfit 2"
                >

                <div class="gallery-overlay">

                    <span class="gallery-category">
                        Classic Edition
                    </span>

                    <h3 class="gallery-title">
                        Minimalist Style
                    </h3>

                </div>

            </div>


            <!-- صورة 3 -->
            <div class="gallery-card">

                <img
                    src="tafra.img/tafra584894.6478978549849.jpeg"
                    alt="TAFRA Outfit 3"
                >

                <div class="gallery-overlay">

                    <span class="gallery-category">
                        New Arrival
                    </span>

                    <h3 class="gallery-title">
                        Luxury Winter Wear
                    </h3>

                </div>

            </div>

        </div>

    </section>


</body>

</html>
